<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1b2733" />
  <title>Ember · Spieler</title>
  <link rel="stylesheet" href="/css/ember.css?v=14" />
  <link rel="stylesheet" href="/css/table-indicator.css?v=1" />
</head>
<body class="house-body">
  <div class="player-shell">
    <header class="topbar">
      <a class="btn tiny ghost" href="/">Home</a>
      <div class="brand">Spieler</div>
      <button class="btn tiny" id="btnRoles" type="button">Rollen</button>
      <div class="grow"></div>
      <a class="btn tiny ghost" href="/token">Atelier</a>
      <div class="chip" id="tableNote">—</div>
      <div class="chip" id="turnChip">—</div>
      <div class="chip" id="who">offen</div>
    </header>
    <div class="role-menu hidden" id="roleMenu"></div>
    <div class="scroll" id="gate">
      <div class="menu-card" style="width:min(640px,94%);margin:24px auto;text-align:left;">
        <h1>An den Tisch</h1>
        <p class="hint">Profil anlegen oder eintreten. Die PIN merkt sich deine Bögen. Über den Tunnel gilt dieselbe PIN. Der Rechner bleibt beim Spielleiter.</p>
        <div class="row" style="gap:8px;margin:8px 0;">
          <label>Name <input id="profileName" autocomplete="username" /></label>
          <label>PIN <input id="profilePin" type="password" autocomplete="current-password" /></label>
        </div>
        <div class="row">
          <button class="btn primary" id="btnProfileEnter" type="button">Eintreten</button>
          <button class="btn" id="btnProfileCreate" type="button">Profil anlegen</button>
        </div>
        <p class="hint" id="profileNote">Noch kein Profil in diesem Tab.</p>
        <div id="tablePlayer" data-table="player"></div>
        <div class="list" id="seatList"></div>
        <button class="btn" id="btnGuest" style="width:100%;margin-top:12px;">Als Gast (Karte + Video)</button>
      </div>
    </div>
    <div class="spur-banner hidden" id="spurBanner"></div>
    <div class="stage hidden" id="mapStage"></div>
    <div class="play-dock hidden" id="playActions">
      <div class="row">
        <button class="btn tiny" id="btnSheet" type="button">Bogen</button>
        <button class="btn primary" id="btnReady" type="button">Ready</button>
        <button class="btn primary" id="btnSpotlight">Want Spotlight</button>
      </div>
      <label>Frage <input id="question" placeholder="Darf ich …" /></label>
      <div class="row">
        <label>Hope <input id="hopeDie" type="number" min="1" max="12" inputmode="numeric" /></label>
        <label>Fear <input id="fearDie" type="number" min="1" max="12" inputmode="numeric" /></label>
        <button class="btn" id="btnTableRoll">Echte Würfel</button>
        <label>Trait
          <select id="traitPick">
            <option value="agility">Agility</option>
            <option value="strength">Strength</option>
            <option value="finesse">Finesse</option>
            <option value="instinct">Instinct</option>
            <option value="presence">Presence</option>
            <option value="knowledge">Knowledge</option>
          </select>
        </label>
        <label>Experience <select id="expPick"><option value="">—</option></select></label>
        <label>Foe <select id="foePick"><option value="">nächster</option></select></label>
        <button class="btn primary" id="btnRoll">Würfeln</button>
      </div>
      <p class="hint" id="rollOut"></p>
      <button class="btn" id="btnPing">Ping</button>
    </div>
    <div class="scroll hidden" id="sheet"></div>
    <div class="scroll hidden" id="playLog"></div>
    <div class="row" id="logFilter" style="padding:0 12px;">
      <input id="playLogQ" placeholder="Log filtern" />
      <select id="playLogKind">
        <option value="">Alles</option>
        <option value="roll">Würfe</option>
        <option value="note">Notizen</option>
      </select>
    </div>
    <div class="scroll hidden" id="handouts"></div>
    <div class="home-media hidden" id="playVideoBox" style="padding:8px 12px;">
      <video id="playVideo" controls playsinline style="width:100%;max-height:240px;background:#0b1016;"></video>
      <div class="list" id="playClips"></div>
    </div>
  </div>
  <script src="/js/table-indicator.js?v=4"></script>
  <script src="/js/video-deck.js?v=5"></script>
  <script src="/js/map.js?v=14"></script>
  <style>
    .player-shell { height: 100dvh; width: 100%; display: flex; flex-direction: column; overflow: hidden; }
    .player-shell.seated { display: grid; grid-template-rows: auto minmax(180px, 1fr) auto auto; }
    #mapStage { min-height: 0; }
    #sheet { max-height: 28dvh; overflow: auto; }
    .play-dock { padding: 8px 12px 12px; background: #120c0b; border-top: 1px solid #3a2a24; }
    .role-menu { position: absolute; top: 52px; right: 12px; z-index: 8; width: min(280px, 92vw); background: #161010; border: 1px solid #3a2a24; padding: 8px; }
    .role-menu .card { width: 100%; text-align: left; margin-top: 6px; }
    /* Handy hochkant: Seite scrollt, die Karte liegt nicht mehr ueber Ready/Spotlight/Frage. */
    @media (max-width: 959px) {
      .player-shell.seated { display: flex; height: auto; min-height: 100dvh; overflow: visible; }
      .player-shell.seated #mapStage { flex: none; }
      .player-shell.seated .scroll { flex: none; }
      .play-dock { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
      /* 16px verhindert das automatische Hineinzoomen am iPhone beim Tippen. */
      .player-shell input, .player-shell select, .player-shell textarea { font-size: 16px; }
      .mark-row .pip { width: 36px; height: 36px; }
    }
    @media (min-width: 960px) {
      .player-shell.seated {
        grid-template-columns: minmax(0, 1.7fr) minmax(340px, 0.75fr);
        grid-template-rows: auto auto minmax(0, 1fr) auto auto auto;
        grid-template-areas:
          "bar bar"
          "spur spur"
          "map dock"
          "map sheet"
          "map log"
          "map filter";
      }
      .player-shell.seated .topbar { grid-area: bar; }
      .player-shell.seated #spurBanner { grid-area: spur; }
      .player-shell.seated #mapStage { grid-area: map; height: 100%; min-height: 420px; }
      .player-shell.seated #playActions { grid-area: dock; border-top: 0; border-left: 1px solid #3a2a24; overflow: auto; }
      .player-shell.seated #sheet { grid-area: sheet; max-height: none; border-left: 1px solid #3a2a24; }
      .player-shell.seated #playLog { grid-area: log; max-height: 28vh; border-left: 1px solid #3a2a24; }
      .player-shell.seated #logFilter { grid-area: filter; border-left: 1px solid #3a2a24; }
      .player-shell.seated #handouts,
      .player-shell.seated #playVideoBox { grid-column: 2; }
    }
  </style>
  <script src="/js/player.js?v=21"></script>
</body>
</html>
