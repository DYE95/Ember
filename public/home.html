<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DYE.TV</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/img/ember-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/ember.css?v=16" />
  <link rel="stylesheet" href="/css/home-desk.css?v=10" />
  <link rel="stylesheet" href="/css/leitstelle.css?v=1" />
</head>
<body class="house-body desk-body">
  <h1 id="houseTitle" class="sr-only">Ember</h1>
  <header class="desk-top stripe" aria-label="Kopfzeile">
    <div class="logo-slot"><img id="logo" src="/icons/ember-logo.png" alt="Logo" hidden /></div>
    <div class="top-status">
      <span class="pill" id="tunnelState">Tunnel …</span>
      <time id="clock" aria-label="Uhrzeit"></time>
    </div>
  </header>

  <main class="desk-main">
    <div class="desk" id="desk"></div>
    <aside class="side-panel has-leitstelle" id="panelSettings" aria-label="Leitstelle und Einstellungen">
      <div class="panel-view leitstelle-view"><div class="ls-grid" id="leitstelle"></div></div>
      <div class="panel-view settings-view">
      <div class="row"><h2 style="flex:1">Einstellungen</h2><button class="btn" id="btnToLeitstelle" type="button">Zur Leitstelle</button></div>
      <label>Schriftgröße <input id="fontSize" type="range" min="12" max="28" /></label>
      <label>Kachelbreite <input id="tileW" type="range" min="160" max="420" /></label>
      <label>Kachelhöhe <input id="tileH" type="range" min="64" max="200" /></label>
      <label>Raster <input id="grid" type="range" min="8" max="48" /></label>
      <p class="hint" id="layoutReadout"></p>
      <label>Profilname <input id="profileName" placeholder="Tisch 1" /></label>
      <div class="row">
        <button class="btn primary" id="btnSaveProfile">Profil speichern</button>
        <button class="btn" id="btnResetLayout">Raster zurück</button>
      </div>
      <div class="list" id="profileList"></div>
      <label class="row"><input type="checkbox" id="lockDesk" /> Tisch feststellen (nicht mehr verschieben)</label>
      <h3>Eigene Kachel</h3>
      <label>Titel <input id="newTitle" placeholder="z. B. Notizen" /></label>
      <label>Untertitel <input id="newSub" placeholder="kurz" /></label>
      <label>Link <input id="newHref" placeholder="/ember oder https://…" /></label>
      <button class="btn" id="btnAddTile">Kachel aufs Raster</button>
      <label>Projektname <input id="setHouseName" /></label>
      <button class="btn" id="btnSaveName">Namen merken</button>
      <div class="row">
        <button class="btn" id="btnExport">Paket (.zip) exportieren</button>
        <label class="btn">Paket laden <input id="packFile" type="file" accept=".zip,.json" hidden /></label>
      </div>
      </div>
    </aside>
  </main>

  <footer class="desk-foot stripe" aria-label="Status">
    <div class="foot-left"><span class="dot" id="serverDot"></span><span id="serverState">Server …</span><button class="foot-restart" id="btnRestartNow" type="button" hidden>Jetzt neu starten</button></div>
    <div class="foot-center"><span id="playerUrl">Spieler-Adresse …</span><span class="sep">·</span><span id="playerCount">0 Spieler</span></div>
    <div class="foot-right">
      <button class="round" id="btnFullscreen" type="button" title="Vollbild" aria-label="Vollbild">⛶</button>
      <button class="round" id="btnReload" type="button" title="Neu laden" aria-label="Seite neu laden">↻</button>
      <button class="round" id="btnServer" type="button" title="Server: Update und Neustart" aria-label="Server">⏻</button>
    </div>
  </footer>

  <section class="desk-panel hidden" id="panelEmber">
    <div class="desk-panel-card">
      <h2>Server</h2>
      <p class="hint">Update holen und Ember neu starten. Nur an diesem Rechner.</p>
      <button class="btn primary" id="btnUpdate">Jetzt prüfen &amp; ziehen</button>
      <button class="btn" id="btnRestart" type="button">Server neu starten</button>
      <pre class="hint" id="updateLog"></pre>
      <button class="btn" data-close>Zurück</button>
    </div>
  </section>
  <section class="desk-panel hidden" id="panelMedia">
    <div class="desk-panel-card wide">
      <h2>Mediathek</h2>
      <p class="hint">mp4, webm, mkv oder mov, auch große Dateien. Bild ↑ ein Frame vor, Bild ↓ eins zurück.</p>
      <video id="homeVideo" controls playsinline></video>
      <div class="list" id="clipList"></div>
      <label class="btn">Video laden <input id="clipFile" type="file" accept="video/*,.mp4,.m4v,.webm,.mkv,.mov" hidden /></label>
      <p class="hint" id="clipStatus" aria-live="polite"></p>
      <button class="btn" data-close>Zurück</button>
    </div>
  </section>

  <script src="/js/video-deck.js?v=6"></script>
  <script src="/js/home-desk.js?v=20"></script>
  <script src="/js/qr.js?v=1"></script>
  <script src="/js/leitstelle/registry.js?v=1"></script>
  <script src="/js/leitstelle/status.js?v=2"></script>
  <script src="/js/leitstelle/kurz.js?v=1"></script>
  <script src="/js/leitstelle/qr.js?v=1"></script>
  <script src="/js/leitstelle/adressen.js?v=1"></script>
  <script src="/js/leitstelle/notizen.js?v=1"></script>
  <script>Leitstelle.start(document.getElementById("leitstelle"));</script>
</body>
</html>
